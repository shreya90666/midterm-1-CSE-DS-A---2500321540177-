
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Student Library Management</h1>
        <p>Manage your books easily</p>

        <div class="search">
            <input type="text" id="filter" placeholder="Search by title, author or category">
            <button onclick="loadBooks()">Search</button>
            <button onclick="showAll()">Show All</button>
        </div>

        <h2>Add New Book</h2>

        <div class="form">
            <input type="text" id="title" placeholder="Book Title">
            <input type="text" id="author" placeholder="Author Name">
            <input type="text" id="category" placeholder="Category">
            <button onclick="addBook()">Add Book</button>
        </div>

        <h2>Available Books</h2>

        <div id="bookList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
